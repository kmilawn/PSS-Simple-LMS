<!DOCTYPE html>
<html>
<head>
    <title>Simple LMS - Welcome</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 600px;
        }
        h1 {
            color: #667eea;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            line-height: 1.6;
        }
        .info {
            background: #f5f5f5;
            border-radius: 5px;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
        }
        .status {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 Simple LMS</h1>
        <p>Your Learning Management System is successfully configured!</p>
        <div class="info">
            <h3>System Information:</h3>
            <p>✅ Django Version: 4.2.7</p>
            <p>✅ Database: PostgreSQL 15</p>
            <p>✅ Docker Containerization: Active</p>
            <p>✅ Status: <span class="status">Running</span></p>
        </div>
        <p>Admin Interface: <a href="/admin">/admin</a><br>
        Credentials: admin / admin123</p>
    </div>
</body>
</html>
